name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
        env:
          # Build needs DATABASE_URL even though it's not used at build-time;
          # tolerate a placeholder so CI doesn't require Neon credentials.
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AI_GATEWAY_API_KEY: ci-placeholder
